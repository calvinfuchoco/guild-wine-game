<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>曲水流觞 · 古风酒局</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Liu+Jian+Mao+Cao&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'ZCOOL XiaoWei', 'Ma Shan Zheng', 'Liu Jian Mao Cao', serif;
      background-color: #f5e6c8;
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(210, 180, 140, 0.3) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 50%, rgba(180, 150, 100, 0.2) 0%, transparent 50%);
      min-height: 100vh;
      color: #3c2415;
      overflow-x: hidden;
    }

    #app {
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
    }

    .setup-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .title-block {
      text-align: center;
      margin-bottom: 2.5rem;
      position: relative;
    }

    .title-block::after {
      content: '';
      display: block;
      width: 80px;
      height: 3px;
      background: #c0392b;
      margin: 1rem auto 0;
      border-radius: 2px;
    }

    .game-title {
      font-family: 'Liu Jian Mao Cao', cursive;
      font-size: 4rem;
      color: #3c2415;
      letter-spacing: 0.3em;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 1.1rem;
      color: #8b6914;
      letter-spacing: 0.5em;
    }

    .setup-card {
      background: linear-gradient(135deg, #faf0e6, #f5e6c8);
      border: 2px solid #c9a96e;
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      position: relative;
    }

    .setup-card::before {
      content: '◆';
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      color: #c0392b;
      font-size: 1.2rem;
    }

    .setup-card h2 {
      font-family: 'Ma Shan Zheng', cursive;
      text-align: center;
      font-size: 1.5rem;
      color: #5c3a21;
      margin-bottom: 1.5rem;
      letter-spacing: 0.2em;
    }

    .player-input-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .player-input-row input {
      flex: 1;
      padding: 0.7rem 1rem;
      border: 2px solid #c9a96e;
      border-radius: 8px;
      background: #fffbf5;
      font-family: 'ZCOOL XiaoWei', serif;
      font-size: 1rem;
      color: #3c2415;
      outline: none;
      transition: border-color 0.3s;
    }

    .player-input-row input:focus {
      border-color: #c0392b;
    }

    .player-input-row input::placeholder {
      color: #b8a07e;
    }

    .btn-add {
      padding: 0.7rem 1.2rem;
      background: #c0392b;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s;
      white-space: nowrap;
    }

    .btn-add:hover {
      background: #a93226;
    }

    .player-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      min-height: 2.5rem;
    }

    .player-tag {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.4rem 0.8rem;
      background: #fffbf5;
      border: 1px solid #c9a96e;
      border-radius: 20px;
      font-size: 0.9rem;
      color: #5c3a21;
    }

    .remove-btn {
      cursor: pointer;
      color: #c0392b;
      font-weight: bold;
      font-size: 1.1rem;
      line-height: 1;
    }

    .remove-btn:hover {
      color: #a93226;
    }

    .setup-actions {
      text-align: center;
    }

    .btn-start {
      padding: 0.8rem 3rem;
      background: #c0392b;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 1.3rem;
      letter-spacing: 0.3em;
      cursor: pointer;
      transition: background 0.3s, opacity 0.3s;
    }

    .btn-start:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-start:not(:disabled):hover {
      background: #a93226;
    }

    .game-screen {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 1rem;
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 1rem;
      background: linear-gradient(135deg, #faf0e6, #f0ddc0);
      border: 1px solid #c9a96e;
      border-radius: 8px;
      margin-bottom: 1rem;
    }

    .round-info {
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 1rem;
      color: #8b6914;
      background: #fffbf5;
      padding: 0.2rem 1rem;
      border-radius: 12px;
      border: 1px solid #c9a96e;
    }

    .player-indicator {
      font-family: 'ZCOOL XiaoWei', serif;
      font-size: 1rem;
      color: #5c3a21;
    }

    .player-indicator strong {
      color: #c0392b;
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 1.1rem;
    }

    .card-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
    }

    .phase-label {
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 1.2rem;
      color: #8b6914;
      letter-spacing: 0.2em;
      text-align: center;
    }

    .card-back {
      width: 220px;
      height: 300px;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      position: relative;
      overflow: hidden;
    }

    .card-back:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
    }

    .card-back:active {
      transform: translateY(0);
    }

    .gong-back {
      background: linear-gradient(145deg, #c0392b, #e74c3c);
      border: 3px solid #a93226;
    }

    .chou-back {
      background: linear-gradient(145deg, #2c3e50, #34495e);
      border: 3px solid #1a252f;
    }

    .card-back-inner {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 9px;
    }

    .card-char {
      font-family: 'Liu Jian Mao Cao', cursive;
      font-size: 5rem;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    .card-sub {
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 0.5rem;
      letter-spacing: 0.1em;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 2rem;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      opacity: 0.05;
      background-image:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 30px,
          rgba(0, 0, 0, 0.05) 30px,
          rgba(0, 0, 0, 0.05) 31px
        );
      pointer-events: none;
    }

    .gong-card {
      background: linear-gradient(135deg, #fffbf5, #faf0e6);
      border: 2px solid #c9a96e;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    .chou-card {
      background: linear-gradient(135deg, #fffbf5, #f0e6d6);
      border: 2px solid #c9a96e;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    .card-seal {
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 40px;
      height: 40px;
      border: 2px solid #c0392b;
      color: #c0392b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Liu Jian Mao Cao', cursive;
      font-size: 1.5rem;
      transform: rotate(15deg);
      border-radius: 4px;
    }

    .gong-title {
      font-family: 'Liu Jian Mao Cao', cursive;
      font-size: 2.8rem;
      color: #3c2415;
      text-align: center;
      margin-bottom: 1rem;
      letter-spacing: 0.1em;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
    }

    .gong-poem {
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 1.2rem;
      color: #5c3a21;
      text-align: center;
      line-height: 1.8;
      padding: 1rem;
      background: rgba(201, 169, 110, 0.1);
      border-radius: 8px;
      border-left: 3px solid #c9a96e;
      margin-bottom: 1rem;
    }

    .gong-annotation {
      font-family: 'ZCOOL XiaoWei', serif;
      font-size: 1rem;
      color: #7a5a3a;
      text-align: center;
      padding: 0.5rem;
      margin-bottom: 1rem;
      background: rgba(192, 57, 43, 0.05);
      border-radius: 6px;
    }

    .gong-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      justify-content: center;
      margin-bottom: 0.8rem;
    }

    .tag {
      padding: 0.2rem 0.7rem;
      background: #c0392b;
      color: #fffbf5;
      border-radius: 12px;
      font-family: 'ZCOOL XiaoWei', serif;
      font-size: 0.8rem;
      letter-spacing: 0.05em;
    }

    .gong-source {
      font-family: 'ZCOOL XiaoWei', serif;
      font-size: 0.8rem;
      color: #b8a07e;
      text-align: right;
      font-style: italic;
    }

    .vote-prompt {
      text-align: center;
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 1.2rem;
      color: #8b6914;
      padding: 0.8rem 1.5rem;
      background: rgba(201, 169, 110, 0.15);
      border-radius: 8px;
      border: 1px dashed #c9a96e;
    }

    .chou-type {
      text-align: center;
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 1rem;
      color: #8b6914;
      margin-bottom: 0.5rem;
    }

    .chou-title {
      font-family: 'Liu Jian Mao Cao', cursive;
      font-size: 2.5rem;
      color: #2c3e50;
      text-align: center;
      margin-bottom: 1rem;
      letter-spacing: 0.1em;
    }

    .chou-instruction {
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 1.3rem;
      color: #3c2415;
      text-align: center;
      line-height: 1.6;
      padding: 1rem;
      background: rgba(44, 62, 80, 0.05);
      border-radius: 8px;
      border-left: 3px solid #2c3e50;
    }

    .chou-execution-hint {
      text-align: center;
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 1rem;
      color: #c0392b;
      padding: 0.5rem 1rem;
    }

    .game-footer {
      display: flex;
      justify-content: center;
      gap: 1rem;
      padding: 1rem 0;
      flex-wrap: wrap;
    }

    .btn-primary {
      padding: 0.8rem 2.5rem;
      background: #c0392b;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 1.2rem;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }

    .btn-primary:hover {
      background: #a93226;
      transform: translateY(-2px);
    }

    .btn-text {
      padding: 0.5rem 1.5rem;
      background: transparent;
      color: #8b6914;
      border: 1px solid #c9a96e;
      border-radius: 8px;
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s, color 0.3s;
    }

    .btn-text:hover {
      background: #c9a96e;
      color: #fff;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
    }

    .overlay-content {
      background: linear-gradient(135deg, #faf0e6, #f5e6c8);
      border: 2px solid #c9a96e;
      border-radius: 12px;
      padding: 2rem;
      max-width: 450px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      position: relative;
    }

    .overlay-content h2 {
      font-family: 'Ma Shan Zheng', cursive;
      text-align: center;
      font-size: 1.5rem;
      color: #5c3a21;
      margin-bottom: 1.5rem;
      letter-spacing: 0.2em;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      margin-bottom: 1.5rem;
    }

    .history-item {
      padding: 0.8rem;
      background: #fffbf5;
      border: 1px solid #c9a96e;
      border-radius: 8px;
      font-family: 'ZCOOL XiaoWei', serif;
      font-size: 0.9rem;
      color: #5c3a21;
    }

    .history-round {
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 1rem;
      color: #c0392b;
      margin-bottom: 0.3rem;
    }

    .history-drawer, .history-gong, .history-chou {
      padding: 0.1rem 0;
    }

    .empty-history {
      text-align: center;
      color: #b8a07e;
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 1.1rem;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card, .card-back, .vote-prompt, .chou-execution-hint {
      animation: fadeInUp 0.5s ease-out;
    }

    @media (max-width: 480px) {
      .game-title { font-size: 3rem; }
      .gong-title { font-size: 2.2rem; }
      .chou-title { font-size: 2rem; }
      .card-back { width: 180px; height: 260px; }
      .game-header { flex-direction: column; gap: 0.3rem; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const state = {
      screen: 'gong-draw',
      currentGong: null,
      currentChou: null,
      history: [],
      usedGongIds: [],
      usedChouIds: []
    };

    const gongData = [
      // ===== 衣着/颜色（保留原有颜色标签）=====
      { id: 1, title: '衣锦尚絅', poem: '乘肥马，衣轻裘，衣服鲜好处十分', annotation: '今天穿得最讲究、最出彩的人', tags: ['华服', '明艳', '时尚', '精致', '大方'], source: '《论语·雍也》' },
      { id: 2, title: '白衣胜雪', poem: '皎皎白驹，在彼空谷，白衣处五分', annotation: '身穿白色/素色衣服的人', tags: ['白衣', '素衣', '儒雅', '清冷', '仙气'], source: '《诗经·小雅·白驹》' },
      { id: 3, title: '红装映日', poem: '朱门酒肉臭，路有冻死骨，朱衣处五分', annotation: '身穿红色/暖色衣服的人', tags: ['红衣', '明艳', '热情', '奔放', '喜庆'], source: '杜甫《自京赴奉先县咏怀五百字》' },
      { id: 4, title: '青青子衿', poem: '青青子衿，悠悠我心，青衣处五分', annotation: '身穿青色/蓝色衣服的人', tags: ['青衫', '儒雅', '沉静', '书卷气', '文艺'], source: '《诗经·郑风·子衿》' },
      { id: 5, title: '紫气东来', poem: '紫袍新秘监，白首旧书生，紫衣处七分', annotation: '身穿紫色衣服的人', tags: ['紫袍', '高贵', '贵气', '典雅', '气场'], source: '白居易《初授秘监并赐金紫》' },
      { id: 6, title: '玄衣如墨', poem: '玄端章甫，缁衣之宜兮，黑衣处五分', annotation: '身穿黑色/深色衣服的人', tags: ['玄衣', '冷峻', '沉稳', '神秘', '干练'], source: '《诗经·郑风·缁衣》' },
      { id: 7, title: '金玉其外', poem: '锦帽貂裘，千骑卷平冈，盛装处十分', annotation: '穿戴最华贵、首饰最多的人', tags: ['锦衣', '华贵', '明艳', '贵气', '精致'], source: '苏轼《江城子·密州出猎》' },
      { id: 8, title: '霓裳羽衣', poem: '云想衣裳花想容，春风拂槛露华浓，天仙处十分', annotation: '今天打扮最精致、最好看的人', tags: ['霓裳', '仙气', '柔美', '明艳', '时尚'], source: '李白《清平调》' },
      // ===== 年龄 =====
      { id: 9, title: '后生可畏', poem: '后生可畏，焉知来者之不如今也，少年处五分', annotation: '在场年纪最小的人', tags: ['少年感', '青春', '活力', '稚嫩', '朝气'], source: '《论语·子罕》' },
      { id: 10, title: '老当益壮', poem: '老骥伏枥，志在千里，长者处七分', annotation: '在场年纪最长的人', tags: ['沉稳', '沧桑', '成熟', '睿智', '从容'], source: '曹操《龟虽寿》' },
      { id: 11, title: '三十而立', poem: '三十而立，四十而不惑，而立者处五分', annotation: '年龄刚好三十岁左右的人', tags: ['成熟', '干练', '稳重', '书卷气', '担当'], source: '《论语·为政》' },
      { id: 12, title: '春秋鼎盛', poem: '盛年不重来，一日难再晨，年富力强者处七分', annotation: '正值壮年、精力最旺盛的人', tags: ['成熟', '豪迈', '活力', '稳健', '担当'], source: '陶渊明《杂诗》' },
      // ===== 地位/职业 =====
      { id: 13, title: '北辰居所', poem: '为政以德，譬如北辰，居其所而众星共之，官高处十分', annotation: '在场职位最高、最有话语权的人', tags: ['紫袍', '贵气', '威严', '气度', '领袖'], source: '《论语·为政》' },
      { id: 14, title: '君子不器', poem: '君子不器，大才槃槃，能者处十分', annotation: '最有本事、最能干的人', tags: ['劲装', '才华', '干练', '自信', '全能'], source: '《论语·为政》' },
      { id: 15, title: '素王', poem: '君子之德风，小人之德草，德高者处七分', annotation: '最有威望、最受尊敬的人', tags: ['儒雅', '沉稳', '睿智', '亲和', '从容'], source: '《论语·颜渊》' },
      { id: 16, title: '青衫司马', poem: '座中泣下谁最多？江州司马青衫湿，位卑者处五分', annotation: '在场职位最低、最基层的人', tags: ['青衫', '低调', '朴实', '谦逊', '踏实'], source: '白居易《琵琶行》' },
      // ===== 远近/亲疏 =====
      { id: 17, title: '有朋远来', poem: '有朋自远方来，不亦乐乎，远客处五分', annotation: '今天来得最远、或是第一次参加的人', tags: ['布衣', '风尘', '热情', '真挚', '洒脱'], source: '《论语·学而》' },
      { id: 18, title: '海内存知己', poem: '海内存知己，天涯若比邻，同座者处五分', annotation: '坐在你旁边最近的人', tags: ['素衣', '温润', '亲和', '随和', '友善'], source: '王勃《送杜少府之任蜀州》' },
      { id: 19, title: '天涯比邻', poem: '海上生明月，天涯共此时，对座者处五分', annotation: '坐在你对面的人', tags: ['白衣', '温润', '浪漫', '深情', '友善'], source: '张九龄《望月怀远》' },
      { id: 20, title: '相去几何', poem: '相去万余里，各在天一涯，相隔最远处七分', annotation: '距你坐得最远的人', tags: ['布衣', '洒脱', '随缘', '好奇', '开朗'], source: '《古诗十九首》' },
      // ===== 言语 =====
      { id: 21, title: '巧言令色', poem: '巧言令色，鲜矣仁，话多者处五分', annotation: '今晚话最多、最健谈的人', tags: ['锦衣', '健谈', '热情', '活泼', '社交'], source: '《论语·学而》' },
      { id: 22, title: '讷言敏行', poem: '君子欲讷于言而敏于行，话少者处七分', annotation: '今晚话最少、最沉默的人', tags: ['素衣', '沉静', '内敛', '沉稳', '神秘'], source: '《论语·里仁》' },
      { id: 23, title: '言必有中', poem: '夫人不言，言必有中，语出惊人者处十分', annotation: '说话最幽默、总能逗笑全场的人', tags: ['锦衣', '幽默', '机智', '自信', '风趣'], source: '《论语·先进》' },
      // ===== 酒量 =====
      { id: 24, title: '饮中八仙', poem: '李白斗酒诗百篇，长安市上酒家眠，海量者处十分', annotation: '酒量最好、最能喝的人', tags: ['布衣', '豪迈', '潇洒', '狂放', '不羁'], source: '杜甫《饮中八仙歌》' },
      { id: 25, title: '不胜杯杓', poem: '不胜杯杓，已醉眼迷离，量浅者处五分', annotation: '酒量最小、最容易醉的人', tags: ['素衣', '温润', '文弱', '含蓄', '可爱'], source: '《史记·项羽本纪》' },
      // ===== 时间/先后 =====

      { id: 27, title: '迟迟吾行', poem: '迟迟吾行也，去父母国之道也，最后到处七分', annotation: '今天到得最晚的人', tags: ['布衣', '从容', '洒脱', '随性', '淡定'], source: '《孟子·万章下》' },
      // ===== 容貌/气质 =====
      { id: 28, title: '窈窕淑女', poem: '窈窕淑女，君子好逑，貌美者处七分', annotation: '全场最养眼、颜值最高的人', tags: ['华服', '柔美', '明艳', '高贵', '迷人'], source: '《诗经·周南·关雎》' },
      { id: 29, title: '望之俨然', poem: '望之俨然，即之也温，最严肃者处五分', annotation: '全场表情最严肃、最不苟言笑的人', tags: ['皂衣', '冷峻', '威严', '沉稳', '端庄'], source: '《论语·子张》' },
      { id: 30, title: '顾盼生辉', poem: '巧笑倩兮，美目盼兮，笑最美者处七分', annotation: '笑容最迷人、最有感染力的人', tags: ['红衣', '柔美', '明媚', '温暖', '活泼'], source: '《诗经·卫风·硕人》' },
      // ===== 性格 =====

      { id: 32, title: '温润如玉', poem: '言念君子，温其如玉，最温雅者处五分', annotation: '最温文尔雅、有君子之风的人', tags: ['白衣', '儒雅', '温润', '书卷气', '斯文'], source: '《诗经·秦风·小戎》' },
      { id: 33, title: '静水流深', poem: '非淡泊无以明志，非宁静无以致远，最淡定者处五分', annotation: '全场最淡定、遇事最不慌的人', tags: ['素衣', '沉静', '从容', '佛系', '淡泊'], source: '诸葛亮《诫子书》' },
      { id: 34, title: '狂者进取', poem: '狂者进取，狷者有所不为也，最活跃者处七分', annotation: '全场最活泼、最能带动气氛的人', tags: ['彩衣', '活泼', '热情', '外向', '充满活力'], source: '《论语·子路》' },
      // ===== 才华 =====
      { id: 35, title: '七步成诗', poem: '笔落惊风雨，诗成泣鬼神，才高者处十分', annotation: '最有才华、最聪明的人', tags: ['青衫', '才华', '儒雅', '睿智', '自信'], source: '杜甫《寄李十二白二十韵》' },
      { id: 36, title: '多才多艺', poem: '游于艺，成于乐，多艺者处七分', annotation: '最多才多艺、会最多技能的人', tags: ['彩衣', '才华', '灵气', '活泼', '全能'], source: '《论语·述而》' },
      // ===== 情绪/状态 =====
      { id: 37, title: '春风得意', poem: '春风得意马蹄疾，一日看尽长安花，喜事者处七分', annotation: '最近最有喜事、心情最好的人', tags: ['锦衣', '少年感', '乐观', '活力', '明媚'], source: '孟郊《登科后》' },
      { id: 38, title: '悠然自得', poem: '采菊东篱下，悠然见南山，最惬意者处五分', annotation: '今天最放松、最享受的人', tags: ['素衣', '沉静', '淡泊', '从容', '自在'], source: '陶渊明《饮酒》' },
      { id: 39, title: '劳形案牍', poem: '无丝竹之乱耳，无案牍之劳形，最疲惫者处七分', annotation: '最近最累、最需要放松的人', tags: ['青衫', '沧桑', '疲惫', '故事感', '真实'], source: '刘禹锡《陋室铭》' },
      // ===== 身份/江湖 =====

      { id: 41, title: '江湖夜雨', poem: '桃李春风一杯酒，江湖夜雨十年灯，老友处十分', annotation: '在座中和大家认识最久的人', tags: ['布衣', '沧桑', '深情', '义气', '真挚'], source: '黄庭坚《寄黄几复》' },
      { id: 42, title: '一见如故', poem: '与君初相识，犹如故人归，新友处五分', annotation: '在座中和大家认识最短、最新加入的人', tags: ['素衣', '温润', '谦逊', '好奇', '友善'], source: '唐·杜牧《会友》' },
      // ===== 动作/习惯 =====

      { id: 44, title: '手不释杯', poem: '主人何为言少钱，径须沽取对君酌，持杯最久者处十分', annotation: '手里杯子一直没放下的人', tags: ['布衣', '豪迈', '潇洒', '不羁', '真实'], source: '李白《将进酒》' },
      { id: 45, title: '击节而歌', poem: '忽闻岸上踏歌声，闻歌起舞者处七分', annotation: '最爱唱歌/哼歌的人', tags: ['彩衣', '活泼', '热情', '文艺', '开朗'], source: '李白《赠汪伦》' },
      // ===== 江湖侠客系列 =====

      { id: 47, title: '铁血丹心', poem: '黄沙百战穿金甲，不破楼兰终不还，最坚韧者处十分', annotation: '意志最坚定、最有毅力的人', tags: ['金甲', '豪迈', '坚韧', '铁血', '执着'], source: '王昌龄《从军行》' },
      { id: 48, title: '独行侠客', poem: '十步杀一人，千里不留行，最獨立者处七分', annotation: '最特立独行、最有主见的人', tags: ['玄衣', '冷峻', '孤傲', '独立', '凌厉'], source: '李白《侠客行》' },
      { id: 49, title: '醉卧沙场', poem: '醉卧沙场君莫笑，古来征战几人回，最洒脱者处五分', annotation: '最豁达乐观、玩笑人生的气氛组', tags: ['戎装', '豪迈', '洒脱', '乐观', '狂放'], source: '王翰《凉州词》' },

      // ===== 隐士/佛系 =====

      { id: 54, title: '独钓寒江', poem: '孤舟蓑笠翁，独钓寒江雪，最爱独处者处七分', annotation: '最喜欢独处、最享受安静的人', tags: ['蓑衣', '孤傲', '沉静', '独立', '深沉'], source: '柳宗元《江雪》' },
      { id: 55, title: '竹林七贤', poem: '独坐幽篁里，弹琴复长啸，最文艺者处五分', annotation: '最有文艺气息、最有品味的人', tags: ['青衫', '文艺', '雅致', '仙气', '书卷气'], source: '王维《竹里馆》' },
      { id: 56, title: '世外高人', poem: '我本楚狂人，凤歌笑孔丘，最不羁者处七分', annotation: '最特立独行、不拘一格的人', tags: ['布衣', '狂放', '不羁', '自在', '洒脱'], source: '李白《庐山谣寄卢侍御虚舟》' },

      // ===== 气场/存在感 =====

      { id: 64, title: '三五成群', poem: '冠者五六人，童子六七人，結伴最多者处五分', annotation: '带最多朋友一起来的人', tags: ['彩衣', '热情', '社交', '活泼', '好客'], source: '《论语·先进》' },

      // ===== 习俗/谐音 =====

      { id: 68, title: '君子好逑', poem: '求之不得，寤寐思服，單身者处七分', annotation: '在座單身的人', tags: ['白衣', '少年感', '潇洒', '自由', '期待'], source: '《诗经·周南·关雎》' },
      { id: 69, title: '三省吾身', poem: '吾日三省吾身，戴眼鏡者处五分', annotation: '戴眼鏡的人', tags: ['青衫', '书卷气', '儒雅', '斯文', '文艺'], source: '《论语·学而》' },
      // ===== 更多性格/状态 =====

      { id: 71, title: '如履薄冰', poem: '战战兢兢，如临深渊，如履薄冰，最緊張者处七分', annotation: '今天看起來最緊張、最不自在的人', tags: ['素衣', '含蓄', '紧张', '认真', '可爱'], source: '《诗经·小雅·小旻》' },
      { id: 72, title: '不亦樂乎', poem: '有朋自遠方來，不亦樂乎？最期待者处五分', annotation: '今天最期待這場酒局的人', tags: ['彩衣', '热情', '期待', '活泼', '开朗'], source: '《论语·学而》' },
      // ===== 五行/方位 =====

      { id: 79, title: '人生得意', poem: '人生得意须尽欢，莫使金樽空对月，最快意者处七分', annotation: '今天最快意、最享受當下的人', tags: ['白衣', '潇洒', '豪迈', '洒脱', '乐观'], source: '李白《将进酒》' },

      const available = gongData.filter(g => !state.usedGongIds.includes(g.id));

      state.currentGong = gong;
      state.screen = 'gong-result';
      renderGongResult();

        round: state.history.length + 1,
        gong: state.currentGong,
        chou: state.currentChou
      });
      state.currentGong = null;
      state.currentChou = null;
      state.screen = 'gong-draw';
      renderGongDraw();
    }

    function showHistory() {
      const overlay = document.createElement('div');
      overlay.className = 'overlay';
      overlay.id = 'historyOverlay';
      overlay.innerHTML = `
        <div class="overlay-content history-panel">
          <h2>历轮回顾</h2>
          <div class="history-list">
            ${state.history.length === 0 ? '<p class="empty-history">尚无记录</p>' :
              state.history.map(h => `
                <div class="history-item">
                  <div class="history-round">第 ${h.round} 轮</div>
                  <div class="history-gong">觥：${h.gong.title}</div>
                  <div class="history-chou">筹：${h.chou.title} — ${h.chou.instruction}</div>
                </div>
              `).join('')
            }
          </div>
          <button onclick="closeHistory()" class="btn-text">关闭</button>
        </div>
      `;
      document.body.appendChild(overlay);
    }

    function closeHistory() {
      const overlay = document.getElementById('historyOverlay');
      if (overlay) overlay.remove();
    }

    // 直接进入游戏，无需setup
    renderGongDraw();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>曲水流觞 · 古风酒局</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Liu+Jian+Mao+Cao&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'ZCOOL XiaoWei', 'Ma Shan Zheng', 'Liu Jian Mao Cao', serif;
      background-color: #f5e6c8;
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(210, 180, 140, 0.3) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 50%, rgba(180, 150, 100, 0.2) 0%, transparent 50%);
      min-height: 100vh;
      color: #3c2415;
      overflow-x: hidden;
    }

    #app {
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
    }

    .setup-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .title-block {
      text-align: center;
      margin-bottom: 2.5rem;
      position: relative;
    }

    .title-block::after {
      content: '';
      display: block;
      width: 80px;
      height: 3px;
      background: #c0392b;
      margin: 1rem auto 0;
      border-radius: 2px;
    }

    .game-title {
      font-family: 'Liu Jian Mao Cao', cursive;
      font-size: 4rem;
      color: #3c2415;
      letter-spacing: 0.3em;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 1.1rem;
      color: #8b6914;
      letter-spacing: 0.5em;
    }

    .setup-card {
      background: linear-gradient(135deg, #faf0e6, #f5e6c8);
      border: 2px solid #c9a96e;
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      position: relative;
    }

    .setup-card::before {
      content: '◆';
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      color: #c0392b;
      font-size: 1.2rem;
    }

    .setup-card h2 {
      font-family: 'Ma Shan Zheng', cursive;
      text-align: center;
      font-size: 1.5rem;
      color: #5c3a21;
      margin-bottom: 1.5rem;
      letter-spacing: 0.2em;
    }

    .player-input-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .player-input-row input {
      flex: 1;
      padding: 0.7rem 1rem;
      border: 2px solid #c9a96e;
      border-radius: 8px;
      background: #fffbf5;
      font-family: 'ZCOOL XiaoWei', serif;
      font-size: 1rem;
      color: #3c2415;
      outline: none;
      transition: border-color 0.3s;
    }

    .player-input-row input:focus {
      border-color: #c0392b;
    }

    .player-input-row input::placeholder {
      color: #b8a07e;
    }

    .btn-add {
      padding: 0.7rem 1.2rem;
      background: #c0392b;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s;
      white-space: nowrap;
    }

    .btn-add:hover {
      background: #a93226;
    }

    .player-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      min-height: 2.5rem;
    }

    .player-tag {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.4rem 0.8rem;
      background: #fffbf5;
      border: 1px solid #c9a96e;
      border-radius: 20px;
      font-size: 0.9rem;
      color: #5c3a21;
    }

    .remove-btn {
      cursor: pointer;
      color: #c0392b;
      font-weight: bold;
      font-size: 1.1rem;
      line-height: 1;
    }

    .remove-btn:hover {
      color: #a93226;
    }

    .setup-actions {
      text-align: center;
    }

    .btn-start {
      padding: 0.8rem 3rem;
      background: #c0392b;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 1.3rem;
      letter-spacing: 0.3em;
      cursor: pointer;
      transition: background 0.3s, opacity 0.3s;
    }

    .btn-start:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-start:not(:disabled):hover {
      background: #a93226;
    }

    .game-screen {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 1rem;
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 1rem;
      background: linear-gradient(135deg, #faf0e6, #f0ddc0);
      border: 1px solid #c9a96e;
      border-radius: 8px;
      margin-bottom: 1rem;
    }

    .round-info {
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 1rem;
      color: #8b6914;
      background: #fffbf5;
      padding: 0.2rem 1rem;
      border-radius: 12px;
      border: 1px solid #c9a96e;
    }

    .player-indicator {
      font-family: 'ZCOOL XiaoWei', serif;
      font-size: 1rem;
      color: #5c3a21;
    }

    .player-indicator strong {
      color: #c0392b;
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 1.1rem;
    }

    .card-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
    }

    .phase-label {
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 1.2rem;
      color: #8b6914;
      letter-spacing: 0.2em;
      text-align: center;
    }

    .card-back {
      width: 220px;
      height: 300px;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      position: relative;
      overflow: hidden;
    }

    .card-back:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
    }

    .card-back:active {
      transform: translateY(0);
    }

    .gong-back {
      background: linear-gradient(145deg, #c0392b, #e74c3c);
      border: 3px solid #a93226;
    }

    .chou-back {
      background: linear-gradient(145deg, #2c3e50, #34495e);
      border: 3px solid #1a252f;
    }

    .card-back-inner {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 9px;
    }

    .card-char {
      font-family: 'Liu Jian Mao Cao', cursive;
      font-size: 5rem;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    .card-sub {
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 0.5rem;
      letter-spacing: 0.1em;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 2rem;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      opacity: 0.05;
      background-image:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 30px,
          rgba(0, 0, 0, 0.05) 30px,
          rgba(0, 0, 0, 0.05) 31px
        );
      pointer-events: none;
    }

    .gong-card {
      background: linear-gradient(135deg, #fffbf5, #faf0e6);
      border: 2px solid #c9a96e;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    .chou-card {
      background: linear-gradient(135deg, #fffbf5, #f0e6d6);
      border: 2px solid #c9a96e;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    .card-seal {
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 40px;
      height: 40px;
      border: 2px solid #c0392b;
      color: #c0392b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Liu Jian Mao Cao', cursive;
      font-size: 1.5rem;
      transform: rotate(15deg);
      border-radius: 4px;
    }

    .gong-title {
      font-family: 'Liu Jian Mao Cao', cursive;
      font-size: 2.8rem;
      color: #3c2415;
      text-align: center;
      margin-bottom: 1rem;
      letter-spacing: 0.1em;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
    }

    .gong-poem {
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 1.2rem;
      color: #5c3a21;
      text-align: center;
      line-height: 1.8;
      padding: 1rem;
      background: rgba(201, 169, 110, 0.1);
      border-radius: 8px;
      border-left: 3px solid #c9a96e;
      margin-bottom: 1rem;
    }

    .gong-annotation {
      font-family: 'ZCOOL XiaoWei', serif;
      font-size: 1rem;
      color: #7a5a3a;
      text-align: center;
      padding: 0.5rem;
      margin-bottom: 1rem;
      background: rgba(192, 57, 43, 0.05);
      border-radius: 6px;
    }

    .gong-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      justify-content: center;
      margin-bottom: 0.8rem;
    }

    .tag {
      padding: 0.2rem 0.7rem;
      background: #c0392b;
      color: #fffbf5;
      border-radius: 12px;
      font-family: 'ZCOOL XiaoWei', serif;
      font-size: 0.8rem;
      letter-spacing: 0.05em;
    }

    .gong-source {
      font-family: 'ZCOOL XiaoWei', serif;
      font-size: 0.8rem;
      color: #b8a07e;
      text-align: right;
      font-style: italic;
    }

    .vote-prompt {
      text-align: center;
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 1.2rem;
      color: #8b6914;
      padding: 0.8rem 1.5rem;
      background: rgba(201, 169, 110, 0.15);
      border-radius: 8px;
      border: 1px dashed #c9a96e;
    }

    .chou-type {
      text-align: center;
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 1rem;
      color: #8b6914;
      margin-bottom: 0.5rem;
    }

    .chou-title {
      font-family: 'Liu Jian Mao Cao', cursive;
      font-size: 2.5rem;
      color: #2c3e50;
      text-align: center;
      margin-bottom: 1rem;
      letter-spacing: 0.1em;
    }

    .chou-instruction {
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 1.3rem;
      color: #3c2415;
      text-align: center;
      line-height: 1.6;
      padding: 1rem;
      background: rgba(44, 62, 80, 0.05);
      border-radius: 8px;
      border-left: 3px solid #2c3e50;
    }

    .chou-execution-hint {
      text-align: center;
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 1rem;
      color: #c0392b;
      padding: 0.5rem 1rem;
    }

    .game-footer {
      display: flex;
      justify-content: center;
      gap: 1rem;
      padding: 1rem 0;
      flex-wrap: wrap;
    }

    .btn-primary {
      padding: 0.8rem 2.5rem;
      background: #c0392b;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 1.2rem;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }

    .btn-primary:hover {
      background: #a93226;
      transform: translateY(-2px);
    }

    .btn-text {
      padding: 0.5rem 1.5rem;
      background: transparent;
      color: #8b6914;
      border: 1px solid #c9a96e;
      border-radius: 8px;
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s, color 0.3s;
    }

    .btn-text:hover {
      background: #c9a96e;
      color: #fff;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
    }

    .overlay-content {
      background: linear-gradient(135deg, #faf0e6, #f5e6c8);
      border: 2px solid #c9a96e;
      border-radius: 12px;
      padding: 2rem;
      max-width: 450px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      position: relative;
    }

    .overlay-content h2 {
      font-family: 'Ma Shan Zheng', cursive;
      text-align: center;
      font-size: 1.5rem;
      color: #5c3a21;
      margin-bottom: 1.5rem;
      letter-spacing: 0.2em;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      margin-bottom: 1.5rem;
    }

    .history-item {
      padding: 0.8rem;
      background: #fffbf5;
      border: 1px solid #c9a96e;
      border-radius: 8px;
      font-family: 'ZCOOL XiaoWei', serif;
      font-size: 0.9rem;
      color: #5c3a21;
    }

    .history-round {
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 1rem;
      color: #c0392b;
      margin-bottom: 0.3rem;
    }

    .history-drawer, .history-gong, .history-chou {
      padding: 0.1rem 0;
    }

    .empty-history {
      text-align: center;
      color: #b8a07e;
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 1.1rem;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card, .card-back, .vote-prompt, .chou-execution-hint {
      animation: fadeInUp 0.5s ease-out;
    }

    @media (max-width: 480px) {
      .game-title { font-size: 3rem; }
      .gong-title { font-size: 2.2rem; }
      .chou-title { font-size: 2rem; }
      .card-back { width: 180px; height: 260px; }
      .game-header { flex-direction: column; gap: 0.3rem; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const state = {
      screen: 'gong-draw',
      currentGong: null,
      currentChou: null,
      history: [],
      usedGongIds: [],
      usedChouIds: []
    };

    const gongData = [
      { id: 1, title: '白马少年', poem: '宗之潇洒美少年，举觞白眼望青天，皎如玉树临风前', annotation: '潇洒不羁的年轻帅哥，意气风发，白衣飘飘', tags: ['白衣', '潇洒', '少年感', '玉树临风', '意气风发'], source: '杜甫《饮中八仙歌》' },
      { id: 2, title: '玉面书生', poem: '腹有诗书气自华', annotation: '温文尔雅、满腹经纶的文化人，气质儒雅', tags: ['青衫', '儒雅', '书卷气', '温润', '斯文'], source: '苏轼《和董传留别》' },
      { id: 3, title: '风流才子', poem: '才子词人，自是白衣卿相', annotation: '恃才傲物、风流倜傥的文艺青年，浪漫多情', tags: ['白衣', '潇洒', '风流', '文艺', '浪漫'], source: '柳永《鹤冲天》' },
      { id: 4, title: '少年游侠', poem: '新丰美酒斗十千，咸阳游侠多少年', annotation: '血气方刚、豪爽仗义的年轻人，爱交朋友', tags: ['劲装', '豪迈', '少年感', '侠气', '义气'], source: '王维《少年行》' },
      { id: 5, title: '簪花少年', poem: '老夫聊发少年狂，左牵黄，右牵苍', annotation: '心态年轻、活力四射的人，永远有少年心', tags: ['锦帽', '豪迈', '少年感', '狂放', '活力'], source: '苏轼《江城子·密州出猎》' },
      { id: 6, title: '仗剑侠客', poem: '事了拂衣去，深藏身与名', annotation: '低调务实的高手，做完事不留名，深藏不露', tags: ['劲装', '冷峻', '侠气', '低调', '干练'], source: '李白《侠客行》' },
      { id: 7, title: '铁血将军', poem: '黄沙百战穿金甲，不破楼兰终不还', annotation: '意志坚定、战斗力爆表的硬核人物', tags: ['金甲', '豪迈', '霸气', '铁血', '坚定'], source: '王昌龄《从军行》' },
      { id: 8, title: '江湖醉客', poem: '黄金白璧买歌笑，一醉累月轻王侯', annotation: '爱喝酒的豪爽人，今朝有酒今朝醉', tags: ['布衣', '潇洒', '豪迈', '狂放', '不羁'], source: '李白《忆旧游寄谯郡元参军》' },
      { id: 9, title: '塞外 warrior', poem: '葡萄美酒夜光杯，欲饮琵琶马上催', annotation: '豪爽干脆的行动派，做事雷厉风行', tags: ['戎装', '豪迈', '果敢', '粗犷', '豪放'], source: '王翰《凉州词》' },
      { id: 10, title: '独行剑客', poem: '十步杀一人，千里不留行', annotation: '能力超强的独行侠，不靠团队靠自己', tags: ['玄衣', '冷峻', '侠气', '孤傲', '凌厉'], source: '李白《侠客行》' },
      { id: 11, title: '红袖佳人', poem: '巧笑倩兮，美目盼兮', annotation: '笑容迷人、眼睛会说话的美人', tags: ['红衣', '温润', '柔美', '典雅', '灵动'], source: '《诗经·卫风·硕人》' },
      { id: 12, title: '霓裳仙子', poem: '云想衣裳花想容，春风拂槛露华浓', annotation: '颜值担当、气质出众，穿什么都好看', tags: ['霓裳', '仙气', '柔美', '典雅', '高贵'], source: '李白《清平调》' },
      { id: 13, title: '巾帼女将', poem: '万里赴戎机，关山度若飞', annotation: '飒爽英姿的女中豪杰，干练独立', tags: ['戎装', '豪迈', '飒爽', '独立', '果敢'], source: '《木兰诗》' },
      { id: 14, title: '闺中秀女', poem: '和羞走，倚门回首，却把青梅嗅', annotation: '含蓄内敛、容易害羞的人，气质温婉', tags: ['素衣', '温润', '含蓄', '文静', '内敛'], source: '李清照《点绛唇》' },
      { id: 15, title: '倾国妖姬', poem: '回眸一笑百媚生，六宫粉黛无颜色', annotation: '魅力值爆表、走到哪都是焦点的人物', tags: ['华服', '妩媚', '高贵', '明艳', '动人'], source: '白居易《长恨歌》' },
      { id: 16, title: '山林隐士', poem: '采菊东篱下，悠然见南山', annotation: '佛系淡泊、不争不抢的世外高人', tags: ['素衣', '沉静', '仙气', '佛系', '淡泊'], source: '陶渊明《饮酒》' },
      { id: 17, title: '垂钓老翁', poem: '孤舟蓑笠翁，独钓寒江雪', annotation: '耐得住寂寞、沉得住气的人，享受独处', tags: ['蓑衣', '沉静', '孤傲', '淡泊', '沉稳'], source: '柳宗元《江雪》' },
      { id: 18, title: '竹林贤士', poem: '独坐幽篁里，弹琴复长啸', annotation: '有自己小世界的人，文艺且自得其乐', tags: ['青衫', '沉静', '文艺', '仙气', '雅致'], source: '王维《竹里馆》' },
      { id: 19, title: '山中高士', poem: '松下问童子，言师采药去', annotation: '神龙见首不见尾的神秘人物，行踪不定', tags: ['素衣', '仙气', '神秘', '淡泊', '超然'], source: '贾岛《寻隐者不遇》' },
      { id: 20, title: '诗圣词宗', poem: '笔落惊风雨，诗成泣鬼神', annotation: '才华横溢的大才子，文字功底一流', tags: ['青衫', '儒雅', '书卷气', '才华', '严谨'], source: '杜甫《寄李十二白二十韵》' },
      { id: 21, title: '醉吟先生', poem: '此中有真意，欲辨已忘言', annotation: '喝酒后有哲理、爱说金句的哲人', tags: ['布衣', '潇洒', '文艺', '深邃', '通透'], source: '陶渊明《饮酒》' },
      { id: 22, title: '癫狂画师', poem: '十日画一水，五日画一石', annotation: '做事极度专注、讲究细节的完美主义者', tags: ['彩衣', '狂放', '文艺', '执着', '匠心'], source: '杜甫《戏题王宰画山水图歌》' },
      { id: 23, title: '抚琴雅士', poem: '为我一挥手，如听万壑松', annotation: '气质优雅、有品味的生活家', tags: ['白衣', '儒雅', '文艺', '雅致', '温润'], source: '李白《听蜀僧濬弹琴》' },
      { id: 24, title: '锦衣玉食', poem: '兰陵美酒郁金香，玉碗盛来琥珀光', annotation: '讲究生活品质、出手大方的富贵人', tags: ['华服', '高贵', '贵气', '精致', '大方'], source: '李白《客中行》' },
      { id: 25, title: '天潢贵胄', poem: '金樽清酒斗十千，玉盘珍羞直万钱', annotation: '气质高贵、自带贵族范儿的人物', tags: ['紫袍', '高贵', '贵气', '典雅', '气度'], source: '李白《行路难》' },
      { id: 26, title: '云游高僧', poem: '竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生', annotation: '心态豁达、看透世事的通透之人', tags: ['僧衣', '沉静', '佛系', '通透', '豁达'], source: '苏轼《定风波》' },
      { id: 27, title: '世外散人', poem: '我本楚狂人，凤歌笑孔丘', annotation: '不拘一格、我行我素的自由灵魂', tags: ['布衣', '潇洒', '狂放', '不羁', '自在'], source: '李白《庐山谣寄卢侍御虚舟》' },
      { id: 28, title: '鬼斧神工', poem: '九秋风露越窑开，夺得千峰翠色来', annotation: '手艺出色的能工巧匠，动手能力极强', tags: ['短褐', '朴实', '匠心', '专注', '沉稳'], source: '陆龟蒙《秘色越器》' },
      { id: 29, title: '市井奇人', poem: '长安市上酒家眠，天子呼来不上船', annotation: '有个性、不拘小节的奇人异士', tags: ['布衣', '潇洒', '狂放', '不羁', '有趣'], source: '杜甫《饮中八仙歌》' },
      { id: 30, title: '千里归人', poem: '寒雨连江夜入吴，平明送客楚山孤', annotation: '重情重义、珍惜朋友的真性情之人', tags: ['青衫', '温润', '深情', '义气', '真挚'], source: '王昌龄《芙蓉楼送辛渐》' },
      { id: 31, title: '白发狂客', poem: '少壮能几时，鬓发各已苍', annotation: '阅历丰富的老江湖，看尽世事沧桑', tags: ['布衣', '豪迈', '沧桑', '通透', '故事感'], source: '杜甫《赠卫八处士》' },
      { id: 32, title: '翩翩佳公子', poem: '陌上谁家年少，足风流', annotation: '颜值与气质俱佳的型男/美女', tags: ['白衣', '少年感', '风流', '贵气', '玉树临风'], source: '韦庄《思帝乡》' },
      { id: 33, title: '暗夜刺客', poem: '流星白羽腰间插，剑花秋莲光出匣', annotation: '行事低调、出手迅速的效率达人', tags: ['玄衣', '冷峻', '神秘', '凌厉', '敏捷'], source: '李白《胡无人》' },
      { id: 34, title: '孤鸿影', poem: '谁见幽人独往来，缥缈孤鸿影', annotation: '喜欢独来独往、享受孤独的独行侠', tags: ['素衣', '沉静', '孤傲', '神秘', '清冷'], source: '苏轼《卜算子·黄州定慧院寓居作》' },
      { id: 35, title: '簪花仕女', poem: '鬓云欲度香腮雪', annotation: '精致讲究的时尚达人，妆容永远在线', tags: ['华服', '柔美', '精致', '明艳', '时尚'], source: '温庭筠《菩萨蛮》' },
      { id: 36, title: '戎装哨卫', poem: '更吹羌笛关山月，无那金闺万里愁', annotation: '坚守岗位、责任感爆棚的靠谱人士', tags: ['戎装', '沉稳', '坚韧', '忠诚', '肃穆'], source: '王昌龄《从军行》' },
      { id: 37, title: '琴心剑胆', poem: '一身转战三千里，一剑曾当百万师', annotation: '文武双全的多面手，能文能武', tags: ['劲装', '豪迈', '侠气', '才华', '全能'], source: '王维《老将行》' },
      { id: 38, title: '凌波微步', poem: '体迅飞凫，飘忽若神，凌波微步，罗袜生尘', annotation: '身姿轻盈灵活、行动敏捷的人', tags: ['素衣', '灵动', '仙气', '柔美', '飘逸'], source: '曹植《洛神赋》' },
      { id: 39, title: '踏雪寻梅', poem: '折梅逢驿使，寄与陇头人', annotation: '有生活情趣、懂得浪漫的细心人', tags: ['红衣', '文艺', '雅致', '浪漫', '温情'], source: '陆凯《赠范晔》' },
      { id: 40, title: '琼楼玉宇', poem: '高处不胜寒', annotation: '高冷范儿、生人勿近的人物，但内心细腻', tags: ['华服', '冷峻', '高贵', '孤傲', '清冷'], source: '苏轼《水调歌头》' },
      { id: 41, title: '不羁浪子', poem: '人生得意须尽欢，莫使金樽空对月', annotation: '及时行乐的享乐主义者，活在当下', tags: ['布衣', '潇洒', '豪迈', '不羁', '乐观'], source: '李白《将进酒》' },
      { id: 42, title: '夜行衣客', poem: '月黑雁飞高，单于夜遁逃', annotation: '白天低调晚上活跃的夜猫子型', tags: ['玄衣', '神秘', '低调', '敏捷', '孤傲'], source: '卢纶《塞下曲》' },
      { id: 43, title: '翠袖佳人', poem: '绿杨烟外晓寒轻，红杏枝头春意闹', annotation: '充满生机和活力、像春天一样的人', tags: ['翠衣', '灵动', '柔美', '活泼', '明媚'], source: '宋祁《玉楼春》' },
      { id: 44, title: '青衫司马', poem: '座中泣下谁最多？江州司马青衫湿', annotation: '共情能力强、情感丰富的感性之人', tags: ['青衫', '温润', '深情', '感性', '真挚'], source: '白居易《琵琶行》' },
      { id: 45, title: '铁面判官', poem: '尔曹身与名俱灭，不废江河万古流', annotation: '说话犀利直接、一针见血的毒舌担当', tags: ['皂衣', '冷峻', '凌厉', '威严', '犀利'], source: '杜甫《戏为六绝句》' },
      { id: 46, title: '软语娇娘', poem: '醉里吴音相媚好，白发谁家翁媪', annotation: '说话温柔好听、让人如沐春风', tags: ['素衣', '温润', '柔美', '温情', '可爱'], source: '辛弃疾《清平乐·村居》' },
      { id: 47, title: '草鞋樵夫', poem: '樵夫下山来，担柴带云归', annotation: '勤劳朴实的实干派，脚踏实地', tags: ['短褐', '朴实', '烟火气', '勤劳', '踏实'], source: '民间古谚' },
      { id: 48, title: '竹篓采药', poem: '采药白云深处，逍遥山水之间', annotation: '热爱大自然、喜欢户外活动的人', tags: ['短褐', '仙气', '淡泊', '自在', '自然'], source: '民间古谚' },
      { id: 49, title: '金簪贵妇', poem: '翠翘金雀玉搔头', annotation: '气场强大的御姐/女王范', tags: ['华服', '高贵', '贵气', '典雅', '气场'], source: '白居易《长恨歌》' },
      { id: 50, title: '踏青游女', poem: '梨花风起正清明，游子寻春半出城', annotation: '爱玩爱笑、喜欢热闹的社交达人', tags: ['彩衣', '灵动', '活泼', '明媚', '热情'], source: '吴惟信《苏堤清明即事》' },
      { id: 51, title: '雪夜归客', poem: '柴门闻犬吠，风雪夜归人', annotation: '总是在关键时刻出现的人，靠谱', tags: ['蓑衣', '温润', '温情', '真挚', '可靠'], source: '刘长卿《逢雪宿芙蓉山主人》' },
      { id: 52, title: '白玉书生', poem: '洛阳亲友如相问，一片冰心在玉壶', annotation: '心地纯洁、为人真诚正直', tags: ['白衣', '温润', '儒雅', '真挚', '冰清'], source: '王昌龄《芙蓉楼送辛渐》' },
      { id: 53, title: '刀笔吏', poem: '文章千古事，得失寸心知', annotation: '做事严谨、追求完美的细节控', tags: ['皂衣', '儒雅', '沉稳', '严谨', '匠心'], source: '杜甫《偶题》' },
      { id: 54, title: '碧玉小家', poem: '碧玉小家女，不敢攀贵德', annotation: '低调谦虚、不争不抢的佛系人物', tags: ['素衣', '朴实', '含蓄', '温婉', '淡泊'], source: '《碧玉歌》' },
      { id: 55, title: '紫衣侯', poem: '紫袍新秘监，白首旧书生', annotation: '有身份有地位但不摆架子的朋友', tags: ['紫袍', '高贵', '儒雅', '亲和', '气度'], source: '白居易《初授秘监并赐金紫》' },
      { id: 56, title: '黄衫客', poem: '黄衫年少来宜数，不见堂前东逝波', annotation: '阳光开朗的大男孩/大女孩', tags: ['黄衫', '少年感', '活泼', '阳光', '热情'], source: '杜甫《少年行》' },
      { id: 57, title: '抚扇谋士', poem: '羽扇纶巾，谈笑间，樯橹灰飞烟灭', annotation: '头脑聪明的智多星，善于出谋划策', tags: ['白衣', '儒雅', '书卷气', '沉稳', '睿智'], source: '苏轼《念奴娇·赤壁怀古》' },
      { id: 58, title: '舞剑姬', poem: '昔有佳人公孙氏，一舞剑器动四方', annotation: '多才多艺、身怀绝技的才艺达人', tags: ['红衣', '飒爽', '灵动', '才华', '明艳'], source: '杜甫《观公孙大娘弟子舞剑器行》' },
      { id: 59, title: '夜读人', poem: '三更灯火五更鸡，正是男儿读书时', annotation: '勤奋刻苦、默默努力的奋斗者', tags: ['青衫', '沉静', '专注', '勤奋', '执着'], source: '颜真卿《劝学》' },
      { id: 60, title: '锦瑟佳人', poem: '锦瑟无端五十弦，一弦一柱思华年', annotation: '怀旧深情、有故事有内涵的人', tags: ['华服', '温润', '深情', '文艺', '典雅'], source: '李商隐《锦瑟》' },
      { id: 61, title: '铁骨硬汉', poem: '千磨万击还坚劲，任尔东西南北风', annotation: '意志坚定、百折不挠的硬骨头', tags: ['劲装', '豪迈', '坚韧', '沉稳', '刚毅'], source: '郑燮《竹石》' },
      { id: 62, title: '含笑花仙', poem: '唯有牡丹真国色，花开时节动京城', annotation: '气场强大、出场自带BGM的人', tags: ['华服', '华贵', '明艳', '高贵', '自信'], source: '刘禹锡《赏牡丹》' },
      { id: 63, title: '折柳送别', poem: '渭城朝雨浥轻尘，客舍青青柳色新', annotation: '重感情、在乎仪式感的温暖之人', tags: ['素衣', '温润', '深情', '真挚', '温情'], source: '王维《送元二使安西》' },
      { id: 64, title: '解语花', poem: '解释春风无限恨，沉香亭北倚阑干', annotation: '善解人意、会照顾人的知心朋友', tags: ['霓裳', '温润', '柔美', '温情', '善解人意'], source: '李白《清平调》' },
      { id: 65, title: '长歌行者', poem: '前不见古人，后不见来者', annotation: '格局宏大、有超前思维的 visionary', tags: ['布衣', '孤傲', '深邃', '通透', '超然'], source: '陈子昂《登幽州台歌》' },
      { id: 66, title: '醉卧沙场', poem: '醉卧沙场君莫笑，古来征战几人回', annotation: '豁达乐观、玩笑人生的气氛组', tags: ['戎装', '豪迈', '狂放', '乐观', '洒脱'], source: '王翰《凉州词》' },
      { id: 67, title: '素衣茶人', poem: '矮纸斜行闲作草，晴窗细乳戏分茶', annotation: '慢生活、懂享受的品味之人', tags: ['素衣', '温润', '雅致', '静气', '品味'], source: '陆游《临安春雨初霁》' },
      { id: 68, title: '仙风道骨', poem: '飘飘乎如遗世独立，羽化而登仙', annotation: '气质超然、不食人间烟火的仙人范', tags: ['白衣', '仙气', '超然', '飘逸', '孤傲'], source: '苏轼《赤壁赋》' },
      { id: 69, title: '烈火烹油', poem: '烹羊宰牛且为乐，会须一饮三百杯', annotation: '热情好客、喜欢张罗局面的组织者', tags: ['锦衣', '豪迈', '热情', '奔放', '大方'], source: '李白《将进酒》' },
      { id: 70, title: '静水深流', poem: '问渠那得清如许？为有源头活水来', annotation: '表面平静内心丰富、不断学习进取', tags: ['青衫', '沉静', '儒雅', '深邃', '睿智'], source: '朱熹《观书有感》' },
      { id: 71, title: '把酒问天', poem: '明月几时有？把酒问青天', annotation: '爱思考哲学问题的深度思考者', tags: ['白衣', '豪迈', '深邃', '通透', '浪漫'], source: '苏轼《水调歌头》' },
      { id: 72, title: '胭脂绯红', poem: '去年今日此门中，人面桃花相映红', annotation: '让人一见难忘、印象深刻的人', tags: ['红衣', '柔美', '明艳', '温婉', '动人'], source: '崔护《题都城南庄》' },
      { id: 73, title: '傲雪寒梅', poem: '宝剑锋从磨砺出，梅花香自苦寒来', annotation: '历经磨难依然坚强的奋斗者', tags: ['素衣', '冷峻', '坚韧', '孤傲', '执着'], source: '《警世贤文》' },
      { id: 74, title: '春风满面', poem: '春风得意马蹄疾，一日看尽长安花', annotation: '最近有好事、心情大好的幸运儿', tags: ['锦衣', '少年感', '乐观', '活力', '明媚'], source: '孟郊《登科后》' },
      { id: 75, title: '红叶题诗', poem: '流水何太急，深宫尽日闲', annotation: '浪漫含蓄、有诗意的文青', tags: ['素衣', '文艺', '浪漫', '含蓄', '典雅'], source: '韩氏《题红叶》' },
      { id: 76, title: '沧海遗珠', poem: '沧海月明珠有泪，蓝田日暖玉生烟', annotation: '被低估的宝藏人物，身怀绝技却不张扬', tags: ['素衣', '温润', '神秘', '内敛', '才华'], source: '李商隐《锦瑟》' },
      { id: 77, title: '大漠孤烟', poem: '大漠孤烟直，长河落日圆', annotation: '性格直爽、心胸开阔的坦荡之人', tags: ['戎装', '豪迈', '直爽', '豁达', '沉稳'], source: '王维《使至塞上》' },
      { id: 78, title: '渔舟唱晚', poem: '落霞与孤鹜齐飞，秋水共长天一色', annotation: '热爱生活、懂得欣赏美景的有心人', tags: ['布衣', '沉静', '文艺', '浪漫', '雅致'], source: '王勃《滕王阁序》' },
      { id: 79, title: '貂蝉拜月', poem: '闭月羞花之貌，沉鱼落雁之容', annotation: '颜值担当、美貌出众的焦点人物', tags: ['华服', '柔美', '高贵', '明艳', '动人'], source: '《三国演义》' },
      { id: 80, title: '温酒斩将', poem: '云长停盏施英勇，酒尚温时斩华雄', annotation: '工作效率极高、又快又好的牛人', tags: ['金甲', '豪迈', '果敢', '凌厉', '霸气'], source: '《三国演义》' },

      { id: 98, title: '八仙过海', instruction: '每人用一种独特的方式喝酒（8种不同姿势），无法完成的人喝', type: '趣味' },
      { id: 99, title: '长长久久', instruction: '与一位朋友久久对视，然后共饮一杯', type: '交杯' },
      { id: 100, title: '十全十美', instruction: '喝完后说一句祝福在场所有人的话', type: '自饮' },
      { id: 101, title: '百事顺遂', instruction: '喝之前说一件你最近最顺心的事，然后饮此杯', type: '自饮' },
      { id: 102, title: '千杯不醉', instruction: '这杯酒分十小口喝，每口间隔至少10秒', type: '自饮' },
      { id: 103, title: '少年游', instruction: '敬你最怀念的少年时光一杯，然后饮尽', type: '自饮' },
      { id: 104, title: '忆江南', instruction: '说一句描写江南的诗词，说不出则饮', type: '趣味' },
      { id: 105, title: '塞上曲', instruction: '说一句描写边塞的诗词，说不出则饮', type: '趣味' },
    ];

    function startGame() {
      state.screen = 'gong-draw';
      state.usedGongIds = [];
      state.usedChouIds = [];
      state.history = [];
      renderGongDraw();
    }

    function renderGongDraw() {
      const app = document.getElementById('app');
      // 如果是第1轮且没有历史，显示漂亮的开场
      const showOpening = state.history.length === 0;
      
      app.innerHTML = `
        <div class="screen game-screen">
          ${showOpening ? `
            <div class="title-block" style="margin-bottom: 2rem;">
              <h1 class="game-title">曲水流觞</h1>
              <p class="subtitle">古风酒局 · 觥筹交错</p>
            </div>
          ` : ''}
          <div class="game-header">
            <span class="round-info">第 ${state.history.length + 1} 轮</span>
          </div>
          <div class="card-section">
            <div class="phase-label">第一步 · 抽觥</div>
            <div class="card-back gong-back" onclick="drawGong()">
              <div class="card-back-inner">
                <span class="card-char">觥</span>
                <span class="card-sub">点击抽取人物</span>
              </div>
            </div>
          </div>
          <div class="game-footer">
            <button onclick="showHistory()" class="btn-text">历轮回顾</button>
          </div>
        </div>
      `;
    }

    function drawGong() {
      const available = gongData.filter(g => !state.usedGongIds.includes(g.id));
      const gong = available[Math.floor(Math.random() * available.length)];
      state.usedGongIds.push(gong.id);
      state.currentGong = gong;
      state.screen = 'gong-result';
      renderGongResult();
    }

    function renderGongResult() {
      const app = document.getElementById('app');
      const gong = state.currentGong;
      const tagHtml = gong.tags.map(t => `<span class="tag">${t}</span>`).join('');
      app.innerHTML = `
        <div class="screen game-screen">
          <div class="game-header">
            <span class="round-info">第 ${state.history.length + 1} 轮</span>
          </div>
          <div class="card-section">
            <div class="phase-label">✨ 抽得人物</div>
            <div class="card gong-card">
              <div class="card-seal">觥</div>
              <div class="gong-title">${gong.title}</div>
              <div class="gong-poem">${gong.poem}</div>
              <div class="gong-annotation">${gong.annotation}</div>
              <div class="gong-tags">${tagHtml}</div>
              <div class="gong-source">—— ${gong.source}</div>
            </div>
            <div class="vote-prompt">📢 全桌投票：谁最符合此人物？口头表决即可</div>
          </div>
          <div class="game-footer">
            <button onclick="proceedToChou()" class="btn-primary">已投票，抽筹！</button>
            <button onclick="drawGong()" class="btn-text">重抽</button>
          </div>
        </div>
      `;
    }

    function proceedToChou() {
      state.screen = 'chou-draw';
      renderChouDraw();
    }

    function renderChouDraw() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="screen game-screen">
          <div class="game-header">
            <span class="round-info">第 ${state.history.length + 1} 轮</span>
          </div>
          <div class="card-section">
            <div class="phase-label">第二步 · 抽筹</div>
            <div class="card-back chou-back" onclick="drawChou()">
              <div class="card-back-inner">
                <span class="card-char">筹</span>
                <span class="card-sub">点击抽取酒令</span>
              </div>
            </div>
          </div>
          <div class="game-footer">
            <button onclick="showHistory()" class="btn-text">历轮回顾</button>
          </div>
        </div>
      `;
    }

    function drawChou() {
      const available = chouData.filter(c => !state.usedChouIds.includes(c.id));
      const chou = available[Math.floor(Math.random() * available.length)];
      state.usedChouIds.push(chou.id);
      state.currentChou = chou;
      state.screen = 'chou-result';
      renderChouResult();
    }

    function renderChouResult() {
      const app = document.getElementById('app');
      const chou = state.currentChou;
      const typeLabels = {
        '自饮': '🍶 自饮',
        '敬人': '🥂 敬人',
        '交杯': '🤝 交杯',
        '指定': '👆 指定',
        '隔座': '↔️ 隔座',
        '全桌': '👥 全桌',
        '趣味': '🎭 趣味',
        '罚酒': '😅 罚酒',
        '组合': '🎲 组合',
      };
      app.innerHTML = `
        <div class="screen game-screen">
          <div class="game-header">
            <span class="round-info">第 ${state.history.length + 1} 轮</span>
          </div>
          <div class="card-section">
            <div class="phase-label">✨ 抽得酒令</div>
            <div class="card chou-card">
              <div class="card-seal">筹</div>
              <div class="chou-type">${typeLabels[chou.type] || chou.type}</div>
              <div class="chou-title">${chou.title}</div>
              <div class="chou-instruction">${chou.instruction}</div>
            </div>
            <div class="chou-execution-hint">🎯 由刚被投中的人物执行此酒令</div>
          </div>
          <div class="game-footer">
            <button onclick="finishRound()" class="btn-primary">完成了！下一轮</button>
          </div>
        </div>
      `;
    }

    function finishRound() {
      state.history.push({
        round: state.history.length + 1,
        gong: state.currentGong,
        chou: state.currentChou
      });
      state.currentGong = null;
      state.currentChou = null;
      state.screen = 'gong-draw';
      renderGongDraw();
    }

    function showHistory() {
      const overlay = document.createElement('div');
      overlay.className = 'overlay';
      overlay.id = 'historyOverlay';
      overlay.innerHTML = `
        <div class="overlay-content history-panel">
          <h2>历轮回顾</h2>
          <div class="history-list">
            ${state.history.length === 0 ? '<p class="empty-history">尚无记录</p>' :
              state.history.map(h => `
                <div class="history-item">
                  <div class="history-round">第 ${h.round} 轮</div>
                  <div class="history-gong">觥：${h.gong.title}</div>
                  <div class="history-chou">筹：${h.chou.title} — ${h.chou.instruction}</div>
                </div>
              `).join('')
            }
          </div>
          <button onclick="closeHistory()" class="btn-text">关闭</button>
        </div>
      `;
      document.body.appendChild(overlay);
    }

    function closeHistory() {
      const overlay = document.getElementById('historyOverlay');
      if (overlay) overlay.remove();
    }

    // 直接进入游戏，无需setup
    renderGongDraw();
  </script>
</body>
</html>
